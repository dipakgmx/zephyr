CONFIG_BT=y
CONFIG_LOG=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_PAIRED=4
CONFIG_SECURE_STORAGE=y

# Services
CONFIG_BT_CTS=y
CONFIG_BT_CTS_HELPER_API=y

CONFIG_BT_HRS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n
CONFIG_BT_ACS=y
CONFIG_BT_ACS_INITIATE_PAIRING=y
CONFIG_BT_ACS_SET_SECURITY_CONTROLS_SWITCH=y
CONFIG_BT_ACS_WORKQUEUE_STACK_SIZE=4096

CONFIG_BT_ACS_CONFIRMATION_OUTPUT_NUMERIC=y

# Bonds, and per peer the ACS ECDH key ID and nonce fixed parts
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

CONFIG_BT_DEVICE_NAME="ACS CTS HRS Demo"
CONFIG_BT_DEVICE_APPEARANCE=256
CONFIG_STACK_SENTINEL=y
CONFIG_BT_RX_STACK_SIZE=8192

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_ASSERT=y
CONFIG_LOG_BUFFER_SIZE=4096
